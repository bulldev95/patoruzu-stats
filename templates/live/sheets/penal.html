{% from "live/sheets/_base.html" import close_btn, zone_select, team_toggle, submit_btn %}
<div x-data="{ team: 'own' }">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold">Penalty</h2>
    {{ close_btn() }}
  </div>
  <form hx-post="/live/{{ match_id }}/events"
        hx-target="#events-feed"
        hx-swap="innerHTML"
        hx-on::after-request="window.dispatchEvent(new CustomEvent('sheet-done'))"
        x-data="{ outcome: null }">
    <input type="hidden" name="type" value="penal">
    <input type="hidden" name="team" :value="team">
    {{ team_toggle() }}

    <template x-if="team === 'own'">
      <div>{{ zone_select() }}</div>
    </template>

    <div class="form-control mb-4">
      <label class="label"><span class="label-text font-medium">Cause</span></label>
      <select name="notes" class="select select-bordered w-full" required>
        <option value="">Select cause…</option>
        {% for cause in ["Off-side","Knock-on","High tackle","Not releasing","Holding on","Scrum","Lineout","Maul","Ruck","Other"] %}
        <option value="{{ cause | lower | replace(' ', '_') }}">{{ cause }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-control mb-4">
      <label class="label"><span class="label-text font-medium">Outcome</span></label>
      <div class="grid grid-cols-2 gap-2">
        {% for value, label in [("kicked","Kicked (3pts)"),("tap","Tap"),("scrum","Our scrum"),("conceded","Conceded")] %}
        <label class="cursor-pointer" @click="outcome = '{{ value }}'">
          <input type="radio" name="result" value="{{ value }}" class="hidden" required>
          <div class="p-3 rounded-lg border-2 text-center text-sm font-semibold transition-colors select-none"
               :class="outcome === '{{ value }}' ? 'border-primary bg-primary text-primary-content' : 'border-base-300 hover:border-base-content/30'">
            {{ label }}
          </div>
        </label>
        {% endfor %}
      </div>
    </div>

    <template x-if="outcome === 'kicked' && team === 'own'">
      <div class="form-control mb-4">
        <label class="label"><span class="label-text font-medium">Kicker</span></label>
        <select name="player_id" class="select select-bordered w-full" required>
          {% for mp, player in players %}
          <option value="{{ player.id }}">{{ mp.number }} – {{ player.surname }}, {{ player.name }}</option>
          {% endfor %}
        </select>
      </div>
    </template>

    {{ submit_btn() }}
  </form>
</div>
