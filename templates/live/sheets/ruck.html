{% from "live/sheets/_base.html" import close_btn, zone_select, result_radio, team_toggle, submit_btn %}
<div x-data="{ team: 'own' }">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold">Ruck</h2>
    {{ close_btn() }}
  </div>
  <form hx-post="/live/{{ match_id }}/events"
        hx-target="#events-feed"
        hx-swap="innerHTML"
        hx-on::after-request="window.dispatchEvent(new CustomEvent('sheet-done'))">
    <input type="hidden" name="type" value="ruck">
    <input type="hidden" name="team" :value="team">
    {{ team_toggle() }}
    <template x-if="team === 'own'">
      <div>{{ zone_select() }}</div>
    </template>
    {{ result_radio([("lost","Lost"),("counter_ruck","Counter-ruck won")]) }}
    {{ submit_btn() }}
  </form>
</div>
