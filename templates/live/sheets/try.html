{% from "live/sheets/_base.html" import close_btn, player_select, zone_select, submit_btn %}
<div class="flex items-center justify-between mb-4">
  <h2 class="text-xl font-bold">Try <span class="badge badge-success">+5</span></h2>
  {{ close_btn() }}
</div>
<form hx-post="/live/{{ match_id }}/events"
      hx-target="#events-feed"
      hx-swap="innerHTML"
      hx-on::after-request="window.dispatchEvent(new CustomEvent('sheet-done'))">
  <input type="hidden" name="type" value="try">
  <input type="hidden" name="result" value="scored">
  {{ player_select(players) }}
  {{ zone_select() }}
  {{ submit_btn("Save Try") }}
</form>
