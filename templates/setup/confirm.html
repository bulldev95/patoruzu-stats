<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patoruzú Stats — Confirm Match</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen p-4">
  <div class="max-w-2xl mx-auto">

    <h1 class="text-2xl font-bold text-center mb-6">Confirm match data</h1>

    <form action="/setup/confirm" method="post">

      <!-- Match info -->
      <div class="card bg-base-100 shadow mb-4">
        <div class="card-body gap-3">
          <h2 class="card-title text-lg">Match info</h2>

          <div class="form-control">
            <label class="label"><span class="label-text">Date</span></label>
            <input type="date" name="date" value="{{ data.date }}" required class="input input-bordered">
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Rival</span></label>
            <input type="text" name="rival" value="{{ data.rival }}" required class="input input-bordered">
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Competition</span></label>
            <input type="text" name="competition" value="{{ data.competition }}" required class="input input-bordered">
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Venue</span></label>
            <input type="text" name="venue" value="{{ data.venue }}" class="input input-bordered">
          </div>
        </div>
      </div>

      <!-- Players -->
      <div class="card bg-base-100 shadow mb-6">
        <div class="card-body">
          <h2 class="card-title text-lg mb-2">Players ({{ data.players | length }})</h2>

          <div class="overflow-x-auto">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="w-12">#</th>
                  <th>Name</th>
                  <th class="w-28">Position</th>
                  <th class="w-28 text-base-content/50">ID</th>
                </tr>
              </thead>
              <tbody>
                {% for player in data.players %}
                <tr>
                  <td class="font-mono font-bold">{{ player.number }}</td>
                  <td>
                    <input type="hidden" name="number_{{ loop.index }}" value="{{ player.number }}">
                    <input type="hidden" name="personal_id_{{ loop.index }}" value="{{ player.personal_id }}">
                    <input
                      type="text"
                      name="name_{{ loop.index }}"
                      value="{{ player.name }}"
                      required
                      class="input input-bordered input-sm w-full"
                    >
                  </td>
                  <td class="text-sm text-base-content/60">
                    {% if player.number <= 15 %}
                      {{ positions[player.number] }}
                    {% else %}
                      <span class="italic">Sub</span>
                    {% endif %}
                  </td>
                  <td class="font-mono text-xs text-base-content/40">{{ player.personal_id }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="flex gap-3">
        <a href="/setup" class="btn btn-ghost flex-1">← Upload again</a>
        <button type="submit" class="btn btn-primary flex-1">Confirm and start match</button>
      </div>

    </form>
  </div>
</body>
</html>
