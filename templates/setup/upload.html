<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patoruzú Stats — New Match</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl justify-center mb-2">Patoruzú Stats</h1>
      <p class="text-center text-base-content/60 mb-6">Upload the UAR formation sheet to start a new match</p>

      {% if error %}
      <div role="alert" class="alert alert-error mb-4">
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/setup/upload" method="post" enctype="multipart/form-data">
        <div class="form-control w-full mb-6">
          <label class="label">
            <span class="label-text font-medium">Formation sheet (PDF)</span>
          </label>
          <input
            type="file"
            name="file"
            accept=".pdf"
            required
            class="file-input file-input-bordered file-input-primary w-full"
          >
        </div>
        <button type="submit" class="btn btn-primary w-full">
          Upload and extract data
        </button>
      </form>
    </div>
  </div>
</body>
</html>
